<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · QuickLift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700&family=Funnel+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/shell.css">
  <style>
    body { margin: 0; min-height: 100vh; background: var(--ql-bg); color: var(--ql-ink); font-family: var(--ql-sans); }
    .login { display: grid; place-items: center; padding: 64px 16px; }
    .login-card { width: 100%; max-width: 380px; padding: 32px; background: var(--ql-card); border: 1px solid var(--ql-line); border-radius: 16px; box-sizing: border-box; }
    .login-card h1 { margin: 0 0 6px; font: 700 26px/1.2 var(--ql-display); letter-spacing: -0.02em; }
    .login-card p { margin: 0 0 22px; color: var(--ql-muted); font-size: 15px; line-height: 1.5; }
    .login-card label { display: block; margin: 0 0 6px; font-weight: 600; font-size: 14px; }
    .login-card input { width: 100%; box-sizing: border-box; margin: 0 0 16px; padding: 11px 12px; border: 1px solid var(--ql-line); border-radius: 10px; font: 16px var(--ql-sans); }
    .login-card input:focus { outline: 2px solid var(--ql-brand); outline-offset: 1px; border-color: transparent; }
    .login-card .ql-btn { width: 100%; margin-top: 4px; }
    .login-error { margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; background: var(--ql-fix-tint); color: var(--ql-fix); font-size: 14px; }
  </style>
</head>
<body>
  <header class="ql-bar">
    <span class="ql-logo"><span class="ql-logo-mark" aria-hidden="true">↑</span><span>QuickLift<span class="ql-logo-tld">.ai</span></span></span>
  </header>
  <main class="login">
    <form class="login-card" method="post" action="/login">
      <h1>Sign in</h1>
      <p>This is the hosted demo of QuickLift. Use the username and password from our slide deck.</p>
      <div class="login-error" id="error" role="alert" hidden></div>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" id="next">
      <button class="ql-btn" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("next").value = q.get("next") || "/";
    const messages = {
      wrong: "That username or password isn't right.",
      wait: "Too many tries from here. Wait fifteen minutes and try again.",
    };
    const msg = messages[q.get("error")];
    if (msg) {
      const box = document.getElementById("error");
      box.textContent = msg;
      box.hidden = false;
    }
  </script>
</body>
</html>
